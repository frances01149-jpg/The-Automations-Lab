<title>SJUB Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --canvas:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --surface-3:#EBEFF6; --line:#E1E6EF;
  --ink:#0E1733; --ink-2:#4A5575; --ink-3:#7C87A3;
  --primary:#142A5E; --primary-ink:#FFFFFF; --primary-soft:#E4E9F6;
  --accent:#DCE566; --accent-ink:#262B00;
  --ok:#17804F; --ok-bg:#DCF3E7; --warn:#9A6200; --warn-bg:#FFEFC7; --crit:#BF2F3C; --crit-bg:#FCE0E3;
  --info:#2F5BD3; --info-bg:#E2E9FD; --none:#5C6784; --none-bg:#ECEFF5;
  --s1:#2F5BD3; --s2:#E0782F; --track:#EEF1F7;
  --shadow:0 1px 2px rgba(14,23,51,.05),0 4px 16px rgba(14,23,51,.04);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --canvas:#0A0F1D; --surface:#151C2D; --surface-2:#1B2336; --surface-3:#222B41; --line:#283149;
  --ink:#EEF2FB; --ink-2:#AFB8CF; --ink-3:#7F89A4;
  --primary:#DCE566; --primary-ink:#1C2100; --primary-soft:#262F46;
  --accent:#DCE566; --accent-ink:#1C2100;
  --ok:#5FD39B; --ok-bg:#123527; --warn:#F2BA4E; --warn-bg:#392B0C; --crit:#FF8089; --crit-bg:#3D1820; --info:#93B1FF; --info-bg:#1B2A55; --none:#A5AEC6; --none-bg:#232B40;
  --s1:#3D6FE0; --s2:#D9702C; --track:#212A40;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0A0F1D; --surface:#151C2D; --surface-2:#1B2336; --surface-3:#222B41; --line:#283149;
  --ink:#EEF2FB; --ink-2:#AFB8CF; --ink-3:#7F89A4;
  --primary:#DCE566; --primary-ink:#1C2100; --primary-soft:#262F46;
  --accent:#DCE566; --accent-ink:#1C2100;
  --ok:#5FD39B; --ok-bg:#123527; --warn:#F2BA4E; --warn-bg:#392B0C; --crit:#FF8089; --crit-bg:#3D1820; --info:#93B1FF; --info-bg:#1B2A55; --none:#A5AEC6; --none-bg:#232B40;
  --s1:#3D6FE0; --s2:#D9702C; --track:#212A40;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--canvas);color:var(--ink);font:500 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:0;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 24px);margin:12px 0 12px 12px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:18px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:700 13px var(--f-display);letter-spacing:.02em}
.brand b{display:block;font:700 15px/1.1 var(--f-display)}
.brand small{color:var(--ink-3);font-size:11.5px}
.nav-group{margin-top:10px}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--primary);color:var(--primary-ink)}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px;background:var(--crit-bg);color:var(--crit)}
.nav a.on .cnt{background:var(--accent);color:var(--accent-ink)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding-top:14px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.me b{display:block;font-size:13px}.me small{color:var(--ink-3);font-size:11.5px}

.main{min-width:0;padding-block:12px 40px;padding-inline:24px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0 20px}
.top h1{font-size:30px;font-weight:700}
.top p{margin:4px 0 0;color:var(--ink-2)}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(14,23,51,.14);padding:6px;min-width:230px;z-index:30}
.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--ink-3);font-weight:500;font-size:11.5px}

/* cards & grid */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.span2{grid-column:span 2}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:16.5px;font-weight:650}
.card-h .sub{color:var(--ink-3);font-size:12.5px;font-weight:600}
.link{color:var(--info);font-weight:700;font-size:12.5px;cursor:pointer;background:none;border:0;padding:0}
.kpi{position:relative;display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .val{font:700 32px/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.hero{background:var(--primary);color:var(--primary-ink)}
.kpi.hero .lab,.kpi.hero .foot{color:inherit;opacity:.82}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.kpi.hero .kpi-ico{background:rgba(255,255,255,.14);color:inherit}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .crit{background:var(--crit-bg);color:var(--crit)} .info{background:var(--info-bg);color:var(--info)} .none{background:var(--none-bg);color:var(--none)}
.snack{background:#FDEBDC;color:#9A4A12} .bev{background:var(--info-bg);color:var(--info)}
:root[data-theme="dark"] .snack{background:#3A2412;color:#F4A56C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .snack{background:#3A2412;color:#F4A56C}}
.muted{color:var(--ink-3)} .small{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:700;font-size:13.5px}
.li .d{font-size:12px;color:var(--ink-3)}
.li .grow{flex:1;min-width:0}
.li-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:10px 12px;white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right}
.iname{font-weight:700}
.isub{font-size:11.5px;color:var(--ink-3)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:220px;flex:1;max-width:360px}
.search input{border:0;background:transparent;outline:none;width:100%}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select.in,input.in,textarea.in{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;outline:none}
select.in:focus,input.in:focus,textarea.in:focus{border-color:var(--info);background:var(--surface)}
input.qty{width:92px;text-align:right;font:700 15px var(--f-body);font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--ink-3);font-weight:500}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:13px}
.toggle input{width:18px;height:18px;accent-color:var(--info)}

/* charts */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:12.5px}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-weight:600}
.hb .tr{height:14px;background:var(--track);border-radius:4px;position:relative}
.hb .tr i{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col i{display:block;width:min(34px,80%);background:var(--s1);border-radius:4px 4px 0 0;min-height:2px}
.col i.alt{background:var(--track)}
.col .cv{font-size:11px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.col-x{display:flex;gap:8px;margin-top:6px}
.col-x span{flex:1;text-align:center;font-size:11px;color:var(--ink-3);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-width:150px;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.progress{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kpi.hero .progress{background:rgba(255,255,255,.18)}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--canvas);font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;max-width:260px;display:none}

/* signal */
.signal{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.signal .big{font:700 28px/1 var(--f-display);letter-spacing:-.01em}
.sig-EXPAND{background:var(--ok-bg);color:var(--ok)} .sig-CONTINUE{background:var(--info-bg);color:var(--info)} .sig-ADJUST{background:var(--warn-bg);color:var(--warn)} .sig-GATHER{background:var(--none-bg);color:var(--none)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lane{background:var(--surface-3);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.lane h3{font-size:14px;display:flex;justify-content:space-between;padding:4px 6px}
.task{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.task .t{font-weight:700}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.day{background:var(--surface-2);border-radius:12px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1px solid transparent}
.day:hover{border-color:var(--line)}
.day.out{opacity:.45}
.day.today{border-color:var(--info);background:var(--surface)}
.day .dn{font-size:12px;font-weight:800;color:var(--ink-2)}
.ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pilot{background:var(--accent);color:var(--accent-ink)}

/* count sheet */
.cat-h{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 6px;font:700 13px var(--f-display);color:var(--ink-2);letter-spacing:.02em;text-transform:uppercase}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 90px 70px 104px;gap:10px;align-items:center;padding:9px 12px;background:var(--surface);border-radius:12px;margin-bottom:6px;border:1px solid var(--line)}
.crow.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 45%,var(--surface))}
.crow .meta{font-size:11.5px;color:var(--ink-3);text-align:right}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.pick label{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface-2);font-size:12.5px;font-weight:700}
.pick label.on{border-color:var(--info);background:var(--info-bg)}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 26px;gap:8px;align-items:center;margin-bottom:6px}
.stars{display:inline-flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:40px;height:38px;font-weight:800;cursor:pointer}
.stars button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(9,14,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:24px;width:min(720px,100%);box-shadow:0 30px 80px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal.wide{width:min(960px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}
.modal-h h2{font-size:21px}
.modal-b{padding:6px 22px 18px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:11px 16px;border-radius:12px;font-weight:700;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.banner{border-radius:16px;padding:12px 16px;margin-bottom:16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.mono{font-family:var(--f-mono);font-size:12px}
.sup{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--ink-3);font-weight:700}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;margin:10px 12px 0;padding:12px;flex-direction:row;align-items:center;gap:8px;overflow-x:auto}
  .brand{padding:0 6px 0 0}.brand div{display:none}
  .nav-group{margin:0;display:flex;gap:4px}.nav-label,.side-foot{display:none}
  .nav a{white-space:nowrap;padding:8px 10px}
  .main{padding-inline:16px}
  .kanban{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}
  .form{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:25px}

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const D = s => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayDiff = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const isDate = s => !!D(s);
const fmtD = s => isDate(s) ? D(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : (s || "—");
const fmtDs = s => isDate(s) ? D(s).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : (s || "—");
const fmtT = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
const stamp = (d, t) => { const x = D(d); if (!x) return 0; if (t) { const [h, m] = t.split(":").map(Number); x.setHours(h, m); } return x.getTime(); };
const fmtStamp = ms => { if (!ms) return "—"; const d = new Date(ms); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ", " + fmtT(`${pad(d.getHours())}:${pad(d.getMinutes())}`); };
const n0 = v => v == null || v === "" || isNaN(v) ? "—" : Math.round(v).toLocaleString("en-US");
const n1 = v => v == null || v === "" || isNaN(v) ? "—" : (+v).toFixed(1);
const pct = v => v == null || isNaN(v) ? "—" : Math.round(v * 100) + "%";
const money = v => v == null || isNaN(v) ? "—" : "$" + (+v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const lsGet = (k, d) => { try { const v = localStorage.getItem("sjubhub:" + k); return v ? JSON.parse(v) : d; } catch { return d; } };

const DEFAULTS = {
  site: "SJUB", lowPct: 0.5, critPct: 0.25, leadDays: 7, expiryWarn: 30, countEveryDays: 7,
  reorderOK: false, refillsFromStock: true, pilotName: "Pantry Pilot", pilotStart: "2026-09-28", pilotDays: 60,
  minFeedback: 10, expandRating: 4.2, expandPositive: 0.6, continueRating: 3.5,

};

const S = {

  settings: { ...DEFAULTS }, products: [], counts: [], receipts: [], orders: [], refills: [], feedback: [], tasks: [], suppliers: [],
  loaded: new Set(), route: "overview",
  f: lsGet("filters", { q: "", status: "all", cat: "all", fbType: "all", fbStatus: "open" }),
  countDraft: lsGet("countDraft", null), cal: monthKey(today()), repMonth: monthKey(today()), orderTab: "suggested", pilotTab: "dash", menu: false
};

/* ------------------------------ icons ------------------------------ */
const P = {
  home: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z",

  cup: "M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v2M11 3v2M14 3v2",
  refill: "M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4",

  down: "M12 4v12M6 11l6 6 6-6M4 20h16", up: "M12 20V8M6 13l6-6 6 6M4 4h16", edit: "M4 20h4L19 9l-4-4L4 16zM14 6l4 4",
  trash: "M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13", warn: "M12 3 2 20h20zM12 10v4M12 17v.5", clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2",
  leaf: "M5 19C5 10 11 5 20 4c-1 9-6 15-15 15zM5 19l7-7", left: "M15 6l-6 6 6 6", right: "M9 6l6 6-6 6", copy: "M8 8h12v12H8zM4 16V4h12"
};
const ic = (k, extra = "") => `<svg class="ico" ${extra} viewBox="0 0 24 24" aria-hidden="true"><path d="${P[k]}"/></svg>`;

/* ---------------------------- navigation --------------------------- */
const NAV = [
  { g: null, items: [["overview", "Overview", "home"]] },
  { g: "Inventory", items: [["stock", "Stock", "box"], ["count", "Weekly Count", "clip"], ["orders", "Orders", "cart"], ["receiving", "Receiving", "truck"], ["suppliers", "Suppliers", "store"]] },
  { g: "Pantry Pilot", items: [["pilot", "Pilot Dashboard", "cup"], ["refills", "Refills", "refill"], ["feedback", "Feedback", "chat"]] },
  { g: "Office", items: [["tasks", "Tasks", "check"], ["calendar", "Calendar", "cal"], ["alerts", "Alerts", "bell"], ["reports", "Reports", "chart"]] },
  { g: "Setup", items: [["settings", "Settings", "gear"]] }
];
const ROUTES = NAV.flatMap(g => g.items.map(i => i[0]));
function go(r) { if (location.hash !== "#" + r) location.hash = r; else { S.route = r; render(); } }
window.addEventListener("hashchange", () => { const r = location.hash.slice(1); S.route = ROUTES.includes(r) ? r : "overview"; S.menu = false; render(); window.scrollTo(0, 0); });

/* ------------------------------ compute ---------------------------- */
let C = null;
function compute() {
  const st = S.settings, t = today();
  const sup = Object.fromEntries(S.suppliers.map(s => [s.id, s]));
  const counts = [...S.counts].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  const openOrders = S.orders.filter(o => ["Draft", "Sent", "Partial"].includes(o.status));
  const recIn = (pid, from, to) => S.receipts.reduce((s, r) => s + ((r.date > (from || "") && (!to || r.date <= to)) ? (+(r.items?.[pid]?.qty) || 0) : 0), 0);
  const refIn = (pid, from, to) => st.refillsFromStock ? S.refills.reduce((s, r) => s + ((r.date > (from || "") && (!to || r.date <= to)) ? (+(r.items?.[pid]?.added) || 0) : 0), 0) : 0;
  const products = S.products.map(p => {
    const hist = [];
    for (const c of counts) { const q = c.items?.[p.id]; if (q !== undefined && q !== null && q !== "") hist.push({ date: c.date, qty: +q, by: c.by }); }
    const last = hist[hist.length - 1], prev = hist[hist.length - 2];
    const par = num(p.par);
    const cur = last ? Math.max(0, last.qty + recIn(p.id, last.date) - refIn(p.id, last.date)) : null;
    let usage = null;
    if (last && prev && dayDiff(prev.date, last.date) > 0) {
      const used = prev.qty + recIn(p.id, prev.date, last.date) - last.qty;
      usage = Math.max(0, used) / (dayDiff(prev.date, last.date) / 7);
    }
    const onOrder = openOrders.reduce((s, o) => s + Math.max(0, (+(o.items?.[p.id]?.qty) || 0) - (+(o.received?.[p.id]) || 0)), 0);
    const ratio = cur != null && par ? cur / par : null;
    let status;
    if (!par) status = "NO PAR"; else if (cur == null) status = "NO COUNT";
    else status = ratio <= st.critPct ? "CRITICAL" : ratio <= st.lowPct ? "LOW" : "OK";
    const short = par && cur != null ? Math.max(0, par - cur) : 0;
    const needs = status === "CRITICAL" || status === "LOW" || (st.reorderOK && status === "OK" && short > 0);
    const orderQty = needs ? Math.max(0, Math.ceil(short - onOrder)) : 0;
    const priority = status === "CRITICAL" ? "URGENT" : orderQty > 0 ? "STANDARD" : "NONE";
    const lead = num(sup[p.supplierId]?.leadDays) ?? st.leadDays;
    const needBy = orderQty > 0 ? addDays(t, priority === "URGENT" ? lead : lead + 7) : null;
    let expDays = null, expStatus = "N/A";
    if (isDate(p.expiration)) { expDays = dayDiff(t, p.expiration); expStatus = expDays < 0 ? "EXPIRED" : expDays <= st.expiryWarn ? "EXPIRING" : "OK"; }
    const cover = usage > 0 && cur != null ? cur / (usage / 7) : null;
    return { ...p, par, cur, last, prev, hist, usage, cover, onOrder, ratio, status, short, orderQty, priority, needBy, expDays, expStatus, supplier: sup[p.supplierId] || null, cost: num(p.unitCost) };
  });
  const byId = Object.fromEntries(products.map(p => [p.id, p]));

  // pilot
  const start = st.pilotStart, end = addDays(st.pilotStart, st.pilotDays - 1);
  const pDay = d => { const k = dayDiff(start, d) + 1; return k >= 1 && k <= st.pilotDays ? k : null; };
  const curDay = t < start ? 0 : Math.min(dayDiff(start, t) + 1, st.pilotDays);
  const pilotP = products.filter(p => p.pilotType === "Snack" || p.pilotType === "Beverage");
  const events = [];
  for (const r of S.refills) for (const [pid, it] of Object.entries(r.items || {})) {
    const before = +it.before || 0, added = +it.added || 0;
    events.push({ rid: r.id, pid, date: r.date, time: r.time, by: r.by, notes: r.notes, before, added, after: before + added, ts: stamp(r.date, r.time), day: pDay(r.date) });
  }
  events.sort((a, b) => a.ts - b.ts);
  const perP = {};
  for (const e of events) { (perP[e.pid] ||= []).push(e); }
  for (const list of Object.values(perP)) list.forEach((e, i) => {
    if (i > 0) { e.prevTs = list[i - 1].ts; e.hours = (e.ts - e.prevTs) / 36e5; e.days = e.hours / 24; e.empty = e.before === 0; }
  });
  const pilotRows = pilotP.map(p => {
    const ev = perP[p.id] || [];
    const units = ev.reduce((s, e) => s + e.added, 0);
    const gaps = ev.filter(e => e.days != null);
    const first = ev[0], lastE = ev[ev.length - 1];
    const activeDays = first ? Math.max(0, dayDiff(first.date, t < end ? t : end) + 1) : null;
    return { p, ev, units, events: ev.length, startQty: first?.after ?? null, first: first?.date, last: lastE?.ts,
      avgGap: gaps.length ? gaps.reduce((s, e) => s + e.days, 0) / gaps.length : null,
      avgQty: ev.length ? units / ev.length : null, empties: ev.filter(e => e.empty).length,
      activeDays, perDay: activeDays ? units / activeDays : null,
      flag: !ev.length ? "NOT PLACED" : t > end ? "ENDED" : "ACTIVE" };
  });
  const fb = S.feedback;
  const ratings = fb.map(f => +f.rating).filter(r => r >= 1 && r <= 5);
  const avgRating = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null;
  const posShare = fb.length ? fb.filter(f => f.type === "Positive").length / fb.length : 0;
  const signal = fb.length < st.minFeedback ? "GATHER MORE DATA" : (avgRating >= st.expandRating && posShare >= st.expandPositive) ? "EXPAND" : avgRating >= st.continueRating ? "CONTINUE" : "ADJUST";
  const gapsAll = events.filter(e => e.days != null);
  const pilot = { start, end, curDay, pDay, events, pilotRows, units: events.reduce((s, e) => s + e.added, 0),
    avgGap: gapsAll.length ? gapsAll.reduce((s, e) => s + e.days, 0) / gapsAll.length : null,
    avgHours: gapsAll.length ? gapsAll.reduce((s, e) => s + e.hours, 0) / gapsAll.length : null,
    remaining: t < start ? st.pilotDays : Math.max(0, dayDiff(t, end)),
    avgRating, posShare, signal, openFU: fb.filter(f => f.followUp && f.status !== "Closed").length,
    empties: events.filter(e => e.empty).length };

  const lastCount = counts.length ? counts[counts.length - 1] : null;
  const cnt = k => products.filter(p => p.status === k).length;
  const counted = cnt("OK") + cnt("LOW") + cnt("CRITICAL");
  const inv = { ok: cnt("OK"), low: cnt("LOW"), crit: cnt("CRITICAL"), noCount: cnt("NO COUNT"), noPar: cnt("NO PAR"),
    health: counted ? cnt("OK") / counted : null, toOrder: products.filter(p => p.orderQty > 0),
    units: products.reduce((s, p) => s + p.orderQty, 0),
    cost: products.reduce((s, p) => s + (p.orderQty && p.cost ? p.orderQty * p.cost : 0), 0),
    expired: products.filter(p => p.expStatus === "EXPIRED"), expiring: products.filter(p => p.expStatus === "EXPIRING"),
    lastCount, sinceCount: lastCount ? dayDiff(lastCount.date, t) : null };

  C = { products, byId, pilot, inv, sup, alerts: [] };
  C.alerts = buildAlerts();
  return C;
}

function buildAlerts() {
  const st = S.settings, t = today(), A = [];
  const add = (sev, title, detail, route, icon) => A.push({ sev, title, detail, route, icon });
  const { inv, pilot } = C;
  for (const p of C.products.filter(p => p.status === "CRITICAL")) add("crit", `${p.name} is critical`, `${n0(p.cur)} on hand of ${n0(p.par)} PAR · order ${n0(p.orderQty)}`, "stock", "box");
  for (const p of inv.expired) add("crit", `${p.name} has expired`, `Expired ${fmtD(p.expiration)} (${Math.abs(p.expDays)} days ago). Remove it from the shelf.`, "stock", "clock");
  for (const p of inv.expiring) add("warn", `${p.name} expires soon`, `Expires ${fmtD(p.expiration)} · ${p.expDays} days left`, "stock", "clock");
  for (const p of C.products.filter(p => p.status === "LOW")) add("warn", `${p.name} is low`, `${n0(p.cur)} on hand of ${n0(p.par)} PAR`, "stock", "box");
  if (!inv.lastCount) add("info", "No weekly count logged yet", "Start the first count to turn on stock levels and ordering.", "count", "clip");
  else if (inv.sinceCount > st.countEveryDays) add("warn", "Weekly count is overdue", `Last count was ${inv.sinceCount} days ago (${fmtD(inv.lastCount.date)}).`, "count", "clip");
  if (inv.noPar) add("info", `${inv.noPar} products have no PAR level`, "Set a PAR so they get a status and appear on orders.", "stock", "box");
  for (const o of S.orders.filter(o => o.status === "Sent" && o.needBy && o.needBy < t)) add("warn", `${o.number} is late`, `Needed by ${fmtD(o.needBy)} and not received yet.`, "orders", "truck");
  for (const o of S.orders.filter(o => o.status === "Draft")) add("info", `${o.number} is still a draft`, "Send it to the supplier or delete it.", "orders", "cart");
  for (const k of S.tasks.filter(k => k.status !== "Done" && k.due && k.due < t)) add("warn", `Overdue task: ${k.title}`, `Due ${fmtD(k.due)}${k.owner ? " · " + k.owner : ""}`, "tasks", "check");
  for (const k of S.tasks.filter(k => k.status !== "Done" && k.due === t)) add("info", `Due today: ${k.title}`, k.owner || "No owner", "tasks", "check");
  for (const f of S.feedback.filter(f => f.followUp && f.status !== "Closed")) {
    const age = dayDiff(f.date, t);
    add(age > 3 ? "warn" : "info", `Follow-up open: ${f.type} feedback`, `${(f.comment || "").slice(0, 70)} · ${age} days open${f.owner ? " · " + f.owner : ""}`, "feedback", "chat");
  }
  const recentEmpty = {};
  for (const e of pilot.events) if (e.empty && dayDiff(e.date, t) <= 7) recentEmpty[e.pid] = (recentEmpty[e.pid] || 0) + 1;
  for (const [pid, n] of Object.entries(recentEmpty)) if (n >= 2) add("warn", `${C.byId[pid]?.name || "A product"} keeps running out`, `The shelf was empty on ${n} refills this week. Raise the refill quantity or refill more often.`, "pilot", "cup");
  if (t < pilot.start && dayDiff(t, pilot.start) <= 14) add("info", `${st.pilotName} starts in ${dayDiff(t, pilot.start)} days`, `Day 1 is ${fmtD(pilot.start)}. Log the first placement as a refill with Qty before = 0.`, "refills", "cup");
  if (t >= pilot.start && t <= pilot.end && dayDiff(t, pilot.end) <= 7) add("info", `${st.pilotName} ends in ${dayDiff(t, pilot.end)} days`, "Review the Pilot Dashboard and prepare the leadership decision.", "pilot", "cup");
  const rank = { crit: 0, warn: 1, info: 2 };
  return A.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

/* ------------------------------ helpers ---------------------------- */
const STATUS_CLS = { OK: "ok", LOW: "warn", CRITICAL: "crit", "NO COUNT": "none", "NO PAR": "none", EXPIRED: "crit", EXPIRING: "warn", "N/A": "none",
  URGENT: "crit", STANDARD: "warn", NONE: "none", ACTIVE: "ok", "NOT PLACED": "none", ENDED: "info",
  Draft: "none", Sent: "info", Partial: "warn", Received: "ok", Open: "crit", "In Review": "warn", Closed: "ok",
  Positive: "ok", Neutral: "none", Concern: "crit", Suggestion: "info", High: "crit", Medium: "warn", Low: "none" };
const pill = (s, label) => `<span class="pill ${STATUS_CLS[s] || "none"}">${esc(label ?? s)}</span>`;
const typeChip = t => t ? `<span class="chip ${t === "Snack" ? "snack" : "bev"}">${esc(t)}</span>` : "";
const empty = (title, text, btn) => `<div class="empty"><b>${esc(title)}</b>${esc(text)}${btn ? `<div style="margin-top:12px">${btn}</div>` : ""}</div>`;
const ro = () => !S.canWrite || !S.db;
const staffDefault = () => S.name || "";

function barFill(ratio, status) {
  const w = Math.max(0, Math.min(1, ratio ?? 0)) * 100;
  const col = { OK: "var(--ok)", LOW: "var(--warn)", CRITICAL: "var(--crit)" }[status] || "var(--ink-3)";
  return `<div class="bar" data-tip="${esc(pct(ratio))} of PAR"><i style="width:${w}%;background:${col}"></i></div>`;
}
function hbars(rows, color = "var(--s1)") {
  if (!rows.length) return empty("Nothing to chart yet", "Data appears here as entries are logged.");
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<div class="hbars">${rows.map(r => `<div class="hb" data-tip="${esc(r.l)}: ${esc(n0(r.v))}${r.tip ? " · " + esc(r.tip) : ""}"><span class="l">${esc(r.l)}</span><span class="tr"><i style="width:${(r.v / max) * 100}%;background:${r.c || color}"></i></span><span class="v">${n0(r.v)}</span></div>`).join("")}</div>`;
}
function cols(rows, { label = true, highlight = -1 } = {}) {
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<div class="cols">${rows.map((r, i) => `<div class="col" data-tip="${esc(r.l)}: ${esc(r.tipv ?? n0(r.v))}">${label && r.v ? `<span class="cv">${esc(r.lab ?? n0(r.v))}</span>` : ""}<i class="${r.v ? "" : "alt"}" style="height:${Math.max(2, (r.v / max) * 128)}px;${i === highlight ? "background:var(--s2)" : ""}"></i></div>`).join("")}</div>
  <div class="col-x">${rows.map(r => `<span>${esc(r.l)}</span>`).join("")}</div>`;
}
function donut(segs, centerTop, centerSub) {
  const total = segs.reduce((s, x) => s + x.v, 0);
  const R = 52, CIRC = 2 * Math.PI * R;
  let off = 0, arcs = "";
  if (total) for (const s of segs) {
    if (!s.v) continue;
    const len = (s.v / total) * CIRC, gap = segs.filter(x => x.v).length > 1 ? 2 : 0;
    arcs += `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(0, len - gap)} ${CIRC}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(s.l)}: ${s.v}</title></circle>`;
    off += len;
  }
  return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(segs.map(s => s.l + " " + s.v).join(", "))}">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--track)" stroke-width="16"/>${arcs}
    <text x="70" y="68" text-anchor="middle" style="font:700 24px var(--f-display);fill:var(--ink)">${esc(centerTop)}</text>
    <text x="70" y="88" text-anchor="middle" style="font:700 11px var(--f-body);fill:var(--ink-3)">${esc(centerSub)}</text></svg>
    <div class="legend">${segs.map(s => `<div><span class="sw" style="background:${s.c}"></span>${esc(s.l)}<b>${s.v}</b></div>`).join("")}</div></div>`;
}
function kpi(label, value, foot, icon, hero = false) {
  return `<div class="card kpi${hero ? " hero" : ""}"><div class="lab"><span>${esc(label)}</span><span class="kpi-ico">${ic(icon)}</span></div><div class="val">${value}</div><div class="foot">${foot}</div></div>`;
}

function isoWeek(s) { const d = D(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
function countSheet(d) {

  </div></div>

      ${o.status === "Draft" ? `<button class="btn sm danger" data-a="del" data-col="orders" data-id="${o.id}" ${ro() ? "disabled" : ""}>${ic("trash")}</button>` : ""}</td></tr>`; }).join("") || `<tr><td colspan="9">${empty("No purchase orders yet", "Create one from the Suggested tab.")}</td></tr>`}
    </tbody></table></div></div>`;
  }
  return topbar("Inventory", "Orders", `Suggested quantities top each LOW and CRITICAL item back up to PAR, minus what is already on order.`,
    `<button class="btn" data-a="export">${ic("down")} Export Excel</button>`) + banners() + `

    ${kpi("Urgent", C.inv.toOrder.filter(p => p.priority === "URGENT").length, "critical items", "warn")}
    ${kpi("Estimated cost", C.inv.cost ? money(C.inv.cost) : "—", C.inv.cost ? "at unit cost" : "Add unit costs to products", "chart")}
    ${kpi("Open POs", S.orders.filter(o => ["Draft", "Sent", "Partial"].includes(o.status)).length, `${S.orders.filter(o => o.status === "Sent").length} sent · ${S.orders.filter(o => o.status === "Draft").length} draft`, "truck")}
  </section>${tabs}${body}`;
};

V.pilot = () => {
  const st = S.settings, pl = C.pilot;
  const progress = pl.curDay / st.pilotDays;
  const statusLine = today() < pl.start ? `Starts in ${dayDiff(today(), pl.start)} days · ${fmtD(pl.start)}` : today() > pl.end ? `Completed · ${fmtD(pl.end)}` : `Day ${pl.curDay} of ${st.pilotDays} · ends ${fmtD(pl.end)}`;
  const rows = [...pl.pilotRows].sort((a, b) => b.units - a.units);
  const top = rows.filter(r => r.units > 0).slice(0, 10).map(r => ({ l: r.p.name, v: r.units, c: r.p.pilotType === "Snack" ? "var(--s2)" : "var(--s1)", tip: r.p.pilotType }));
  const rd = [1, 2, 3, 4, 5].map(k => ({ l: k + "★", v: S.feedback.filter(f => +f.rating === k).length }));
  const weeks = Math.ceil(st.pilotDays / 7);
  const wk = Array.from({ length: weeks }, (_, i) => ({ l: "W" + (i + 1), v: pl.events.filter(e => e.day && Math.ceil(e.day / 7) === i + 1).reduce((s, e) => s + e.added, 0) }));
  const sn = pl.events.filter(e => C.byId[e.pid]?.pilotType === "Snack").reduce((s, e) => s + e.added, 0);
  const bv = pl.events.filter(e => C.byId[e.pid]?.pilotType === "Beverage").reduce((s, e) => s + e.added, 0);
  const sigKey = pl.signal.split(" ")[0];
  const tabs = `<div class="tabs"><button class="${S.pilotTab === "dash" ? "on" : ""}" data-tab="pilotTab" data-v="dash">Dashboard</button><button class="${S.pilotTab === "products" ? "on" : ""}" data-tab="pilotTab" data-v="products">Pilot products (${pl.pilotRows.length})</button></div>`;
  const head = topbar("Pantry Pilot", esc(st.pilotName), `${statusLine}. Snacks and beverages placed in the pantry, how fast they go and what employees think.`,
    `<button class="btn" data-a="new-feedback" ${ro() ? "disabled" : ""}>${ic("chat")} Feedback</button><button class="btn accent" data-a="new-refill" ${ro() ? "disabled" : ""}>${ic("refill")} Log refill</button>`) + banners() + tabs;
  if (S.pilotTab === "products") return head + `<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Product</th><th>Type</th><th>Status</th><th class="n">Start qty</th><th class="n">Target (PAR)</th><th>First placed</th><th class="n">Days active</th><th class="n">Refills</th><th class="n">Units placed</th><th class="n">Avg / refill</th><th class="n">Avg days between</th><th class="n">Empty on arrival</th><th>Last refill</th><th class="n">Units / day</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-a="edit-product" data-id="${r.p.id}"><td><div class="iname">${esc(r.p.name)}</div><div class="isub">${esc(r.p.category)}</div></td><td>${typeChip(r.p.pilotType)}</td><td>${pill(r.flag)}</td><td class="n">${n0(r.startQty)}</td><td class="n">${n0(r.p.par)}</td><td>${fmtDs(r.first)}</td><td class="n">${n0(r.activeDays)}</td><td class="n">${r.events}</td><td class="n"><b>${n0(r.units)}</b></td><td class="n">${n1(r.avgQty)}</td><td class="n">${n1(r.avgGap)}</td><td class="n">${r.empties ? `<span class="chip warn">${r.empties}</span>` : "0"}</td><td>${fmtStamp(r.last)}</td><td class="n">${n1(r.perDay)}</td></tr>`).join("") || `<tr><td colspan="14">${empty("No pilot products", "Mark products as Snack or Beverage in Settings or on the product itself.")}</td></tr>`}
    </tbody></table></div></div>`;
  return head + `
  <section class="card kpi hero" style="margin-bottom:16px"><div class="lab"><span>Pilot progress</span><span>${pct(progress)}</span></div><div class="progress" style="height:12px"><i style="width:${progress * 100}%"></i></div><div class="foot">${fmtD(pl.start)} → ${fmtD(pl.end)}</div></section>
  <section class="grid g4">
    ${kpi("Pilot day", pl.curDay || "—", `of ${st.pilotDays} planned days`, "cal")}
    ${kpi("Days remaining", pl.remaining, `ends ${fmtDs(pl.end)}`, "clock")}
    ${kpi("Refill events", pl.events.length, `${pl.pilotRows.filter(r => r.flag === "ACTIVE").length} products active`, "refill")}
    ${kpi("Units placed", n0(pl.units), pl.curDay ? `${n1(pl.units / pl.curDay)} units / day` : "—", "box")}
    ${kpi("Avg days between refills", n1(pl.avgGap), pl.avgHours ? `≈ ${n0(pl.avgHours)} hours per product` : "No repeat refills yet", "refill")}
    ${kpi("Feedback entries", S.feedback.length, `${S.feedback.filter(f => f.type === "Positive").length} positive · ${S.feedback.filter(f => f.type === "Concern").length} concerns`, "chat")}
    ${kpi("Average rating", pl.avgRating == null ? "—" : pl.avgRating.toFixed(1), `out of 5 · ${S.feedback.length} ratings`, "leaf")}
    ${kpi("Open follow-ups", pl.openFU, "feedback needing action", "warn")}
  </section>
  <section class="grid g-main" style="margin-top:16px">
    <div class="card"><div class="card-h"><h3>Units placed by product</h3><span class="sub"><span class="chip snack">Snack</span> <span class="chip bev">Beverage</span></span></div>${hbars(top)}</div>
    <div class="card"><div class="card-h"><h3>Leadership decision signal</h3></div>
      <div class="signal sig-${sigKey}"><span class="small" style="font-weight:800;letter-spacing:.06em">RECOMMENDATION</span><span class="big">${esc(pl.signal)}</span></div>
      <div class="list" style="margin-top:10px">
        <div class="li"><div class="grow">Positive feedback</div><b>${pct(pl.posShare)}</b></div>
        <div class="li"><div class="grow">Average rating</div><b>${pl.avgRating == null ? "—" : pl.avgRating.toFixed(1) + " / 5"}</b></div>
        <div class="li"><div class="grow">Refills that found the shelf empty</div><b>${pl.empties}</b></div>
        <div class="li"><div class="grow">Projected units for the full pilot</div><b>${pl.curDay ? n0(pl.units / pl.curDay * st.pilotDays) : "—"}</b></div>
        <div class="li"><div class="grow">Snack · Beverage units</div><b>${n0(sn)} · ${n0(bv)}</b></div>
      </div>
      <p class="small muted" style="margin:10px 0 0">EXPAND when the average rating is at least ${st.expandRating} and ${pct(st.expandPositive)} of feedback is positive. CONTINUE when the rating is at least ${st.continueRating}. Otherwise ADJUST. Needs ${st.minFeedback} feedback entries.</p></div>
  </section>
  <section class="grid g2" style="margin-top:16px">
    <div class="card"><div class="card-h"><h3>Units placed per pilot week</h3></div>${cols(wk, { highlight: pl.curDay ? Math.ceil(pl.curDay / 7) - 1 : -1 })}</div>
    <div class="card"><div class="card-h"><h3>Rating distribution</h3><span class="sub">${S.feedback.length} responses</span></div>${cols(rd)}</div>
  </section>`;
};

function calEvents() {
  const E = {};
  const add = (d, label, cls) => { if (isDate(d)) (E[d] ||= []).push({ label, cls }); };
  for (const c of S.counts) add(c.date, "Weekly count", "info");
  for (const r of S.receipts) add(r.date, "Delivery" + (C.sup[r.supplierId] ? " · " + C.sup[r.supplierId].name : ""), "ok");
  const byDay = {}; for (const r of S.refills) byDay[r.date] = (byDay[r.date] || 0) + 1;
  for (const [d, n] of Object.entries(byDay)) add(d, `Refill ×${n}`, "warn");
  for (const k of S.tasks) if (k.status !== "Done") add(k.due, "Task · " + k.title, "none");

  const pos = S.orders.filter(o => inM(o.created));
  const poValue = pos.reduce((s, o) => s + Object.values(o.items || {}).reduce((a, x) => a + (+x.qty || 0) * (+x.cost || 0), 0), 0);
  const ev = C.pilot.events.filter(e => inM(e.date));

/* ------------------------------ writes ----------------------------- */
async function put(col, id, data, merge = false) {
  if (!S.db) { toast("Saving is unavailable in this view."); return null; }
  try {
    const ref = id ? S.db.collection(col).doc(id) : S.db.collection(col).doc();
    if (merge) await ref.update(data); else await ref.set(data);
    return ref.id;
  } catch (e) {
    if (e?.code === "invalid_argument" && !S.canWriteKnown) { S.canWrite = false; render(); toast("You have view-only access, so this was not saved."); }
    else if (e?.code === "quota_exceeded") toast("Storage is full. Delete old entries, then try again.");
    else if (e?.code === "unavailable") toast("The connection dropped. Try again in a moment.");
    else toast("Could not save: " + (e?.message || "unknown error"));
    return null;
  }
}
async function del(col, id) { if (!S.db) return; try { await S.db.collection(col).doc(id).delete(); toast("Deleted"); } catch (e) { toast("Could not delete: " + (e?.message || "")); } }

/* --------------------------- import / export ------------------------ */
const HK = {
  par: ["par value", "par level", "par", "nivel par"], expiration: ["expiration", "expiry", "exp date", "vencimiento", "caducidad"],
  received: ["recent date received", "date received", "received", "recibido", "fecha"], number: ["item #", "item#", "item no", "item number", "no.", "número", "numero", "código", "codigo", "sku", "code", "#"],
  category: ["category", "categoría", "categoria"], name: ["item name", "nombre", "producto", "product", "description", "descripción", "descripcion", "artículo", "articulo", "item"]
};
const hmatch = (v, keys) => { const t = String(v).trim().toLowerCase(); return keys.some(k => t === k || t.startsWith(k) || t.includes(k)); };
function toISO(v) {
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  if (typeof v === "string") { const m = v.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return `${m[3]}-${pad(m[1])}-${pad(m[2])}`; if (isDate(v.trim())) return v.trim(); }
  return null;
}
function parseRows(rows) {
  let hr = -1, cols = {};
  for (let i = 0; i < Math.min(rows.length, 25); i++) {
    const c = {};
    (rows[i] || []).forEach((v, ci) => { if (v == null || v === "") return; for (const k of ["par", "expiration", "received", "number", "category", "name"]) if (!(k in c) && hmatch(v, HK[k])) { if (k === "name" && hmatch(v, HK.number) && String(v).trim().toLowerCase() !== "item") continue; c[k] = ci; break; } });
    if ("name" in c && "par" in c) { hr = i; cols = c; break; }
  }
  if (hr < 0) throw new Error("Could not find a header row with Item Name and PAR.");
  const out = []; let section = "";
  for (const row of rows.slice(hr + 1)) {
    const g = k => k in cols ? row[cols[k]] : null;
    const name = g("name");
    if (name == null || String(name).trim() === "") { const texts = (row || []).filter(v => v != null && String(v).trim()); if (texts.length === 1) section = String(texts[0]).trim(); continue; }
    const exp = g("expiration"), par = g("par");
    out.push({ name: String(name).trim(), category: g("category") ? String(g("category")).trim() : "Uncategorized", itemNo: g("number") == null ? "" : String(g("number")).trim(), section,
      received: toISO(g("received")), expiration: toISO(exp) || (exp == null ? "" : String(exp).trim()), par: num(par), unitCost: null, supplierId: "", pilotType: "" });
  }
  const SN = ["snack", "cookie", "biscuit", "chip", "candy", "nut", "cracker", "pretzel", "popcorn", "granola", "mint"], BV = ["beverage", "drink", "soda", "water", "juice", "coffee", "tea", "bebida", "café", "agua"], NB = ["lid", "cup", "stir", "sweet", "straw"];
  for (const p of out) { const c = p.category.toLowerCase(); if (BV.some(w => c.includes(w)) && !NB.some(w => c.includes(w))) p.pilotType = "Beverage"; else if (/snack/i.test(p.section) || SN.some(w => c.includes(w))) p.pilotType = "Snack"; }
  return out;
}

  sheet("Suppliers", S.suppliers.map(s => ({ Supplier: s.name, Contact: s.contact, Phone: s.phone, Email: s.email, "Lead Days": s.leadDays, Notes: s.notes })));
  const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const filename = `${S.settings.site}_Operations_${today()}.xlsx`;
  if (!downloads) { toast("Downloads are not available in this view."); return; }
  try { await downloads.save({ filename, data: new Uint8Array(data) }); toast("Excel file saved"); }
  catch (e) { if (e?.code !== "declined") toast("Could not save the file: " + (e?.message || e?.code)); }
}

/* ------------------------------ events ----------------------------- */
document.addEventListener("click", async e => {
  const close = e.target.closest("[data-close]");
  if (close && (e.target === close || close.tagName === "BUTTON")) { closeModal(); return; }
  const goEl = e.target.closest("[data-go]"); if (goEl) { go(goEl.dataset.go); return; }
  const fset = e.target.closest("[data-fset]"); if (fset) { S.f[fset.dataset.fset] = fset.dataset.v; lsSet("filters", S.f); render(); return; }
  const tab = e.target.closest("[data-tab]"); if (tab) { S[tab.dataset.tab] = tab.dataset.v; render(); return; }
  if (S.menu && !e.target.closest(".menu")) { S.menu = false; render(); }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.disabled) return;
  if (a !== "menu") S.menu = false;
  switch (a) {
    case "menu": S.menu = !S.menu; render(); break;
    case "new-count": startCount(); break;
    case "new-refill": render(); refillForm(); break;
    case "new-feedback": render(); feedbackForm(); break;
    case "new-receipt": render(); receiptForm(el.dataset.po); break;
    case "new-task": render(); taskForm(id); break;
    case "new-product": render(); productForm(); break;
    case "edit-product": productForm(id); break;
    case "edit-supplier": supplierForm(id); break;
    case "go-orders": go("orders"); break;
    case "go-feedback": go("feedback"); break;
    case "import": importForm(); break;
    case "export": exportExcel(); break;
    case "count-cancel": confirmBox("Discard this count? The numbers you typed will be lost.", "Discard", async () => { S.countDraft = null; lsSet("countDraft", null); render(); }); break;
    case "count-save": saveCount(); break;
    case "view-count": viewCount(id); break;
    case "create-po": createPO(id); break;
    case "view-po": viewPO(id); break;
    case "po-sent": await put("orders", id, { status: "Sent", sentDate: today() }, true); toast("Marked as sent"); break;
    case "task-move": { const k = S.tasks.find(x => x.id === id); const upd = { status: el.dataset.v }; if (el.dataset.v === "Done") upd.doneDate = today(); if (await put("tasks", id, upd, true) && el.dataset.v === "Done") await spawnRepeat({ ...k, ...upd }); break; }
    case "del": { const labels = { counts: "this count", receipts: "this delivery (its units leave stock)", orders: "this draft purchase order", refills: "this whole refill round", feedback: "this feedback", tasks: "this task" };
      confirmBox(`Delete ${labels[el.dataset.col] || "this entry"}? This cannot be undone.`, "Delete", () => del(el.dataset.col, id)); break; }
    case "cal": { const v = +el.dataset.v; if (!v) S.cal = monthKey(today()); else { const [y, m] = S.cal.split("-").map(Number); S.cal = monthKey(iso(new Date(y, m - 1 + v, 1))); } render(); break; }
    case "cal-day": calDay(el.dataset.v); break;
    case "copy-report": copyText(reportText(S.repMonth), $("#rep-text")); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f) { S.f[t.dataset.f] = t.value; lsSet("filters", S.f); render(); }
  else if (t.dataset.cd) { S.countDraft[t.dataset.cd] = t.value; lsSet("countDraft", S.countDraft); if (t.dataset.cd === "q") render(); }
  else if (t.dataset.cq) { const v = t.value; if (v === "") delete S.countDraft.items[t.dataset.cq]; else S.countDraft.items[t.dataset.cq] = v; lsSet("countDraft", S.countDraft); t.closest(".crow")?.classList.toggle("done", v !== ""); clearTimeout(t._r); t._r = setTimeout(render, 700); }
  else if (t.dataset.oq) { (S.orderDraft ||= {})[t.dataset.oq] = t.value === "" ? 0 : +t.value; }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.f) { S.f[t.dataset.f] = t.value; lsSet("filters", S.f); render(); }
  else if (t.dataset.rep) { S.repMonth = t.value; render(); }
  else if (t.dataset.fbstatus) { const upd = { status: t.value, resolvedDate: t.value === "Closed" ? today() : null }; await put("feedback", t.dataset.fbstatus, upd, true); toast("Status updated"); }
  else if (t.dataset.catmap) { const v = t.value; if (v === "Mixed") return; const ps = S.products.filter(p => p.category === t.dataset.catmap); for (const p of ps) if ((p.pilotType || "") !== v) await put("products", p.id, { pilotType: v }, true); toast(`${ps.length} products updated`); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "settings-form") return;
  e.preventDefault();
  const v = fd(e.target), st = S.settings;
  const pctv = x => Math.max(0, Math.min(100, +x)) / 100;
  const next = { ...st, site: v.site.trim() || st.site, countEveryDays: +v.countEveryDays || 7, lowPct: pctv(v.lowPct), critPct: pctv(v.critPct), leadDays: +v.leadDays || 0, expiryWarn: +v.expiryWarn || 0,
    reorderOK: !!v.reorderOK, refillsFromStock: !!v.refillsFromStock, pilotName: v.pilotName.trim() || "Pantry Pilot", pilotStart: v.pilotStart || st.pilotStart, pilotDays: Math.max(1, +v.pilotDays || 60),
    minFeedback: +v.minFeedback || 0, expandRating: +v.expandRating || 4.2, expandPositive: pctv(v.expandPositive), continueRating: +v.continueRating || 3.5,
    staff: v.staff.split("\n").map(s => s.trim()).filter(Boolean), teams: v.teams.split("\n").map(s => s.trim()).filter(Boolean) };
  if (next.critPct > next.lowPct) { toast("The critical level must be at or below the low-stock level."); return; }
  if (await put("settings", "main", next)) toast("Settings saved");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal(); });
const tip = $("#tip");
document.addEventListener("mousemove", e => { const el = e.target.closest?.("[data-tip]"); if (!el) { tip.style.display = "none"; return; } tip.textContent = el.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

function startCount() {
  if (!S.countDraft) { S.countDraft = { date: today(), by: staffDefault(), q: "", items: {} }; lsSet("countDraft", S.countDraft); }
  go("count");
}
async function saveCount() {
  const d = S.countDraft; if (!d) return;
  if (!d.by?.trim()) { toast("Enter who counted."); $("#cd-by")?.focus(); return; }
  const items = {}; for (const [pid, v] of Object.entries(d.items)) if (v !== "" && v != null && !isNaN(+v) && S.products.some(p => p.id === pid)) items[pid] = +v;
  if (!Object.keys(items).length) { toast("Enter at least one quantity."); return; }
  if (await put("counts", null, { date: d.date || today(), by: d.by.trim(), items, createdAt: Date.now() })) { S.countDraft = null; lsSet("countDraft", null); toast(`Count saved · ${Object.keys(items).length} products`); render(); }
}

/* ------------------------------- boot ------------------------------ */
S.route = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
render();
(async () => {
  const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  if (user) {
    try { S.name = (await user.name()) || ""; } catch {}
    try { const w = await user.can("data.write"); if (w === false) { S.canWrite = false; } S.canWriteKnown = w !== null; } catch {}
  }
  S.db = db; S.dbState = db ? "ready" : "none";
  if (!db) { render(); return; }
  db.doc("settings/main").onSnapshot(s => { S.settings = { ...DEFAULTS, ...(s.exists ? s.data() : {}) }; render(); }, () => {});
  for (const c of COLS) db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (c === "products") S[c].sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || a.name.localeCompare(b.name)); S.loaded.add(c); render(); },
    err => { if (err?.code === "revoked") { S.db = null; S.dbState = "none"; render(); } });
  render();
})();
</script>
